[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uscis-case-cohort-analyzer"
version = "0.1.0"
description = "A privacy-conscious USCIS Case Status API client and cohort-analysis toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aayushga" }]
keywords = ["uscis", "immigration", "case-status", "cohort-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
uscis-cohort = "uscis_cohort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

